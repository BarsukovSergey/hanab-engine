name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets --all-features --locked

  live-bridge:
    name: Live bridge Python checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Python development dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement scripts/requirements-dev.txt

      - name: Type-check Python
        run: .venv/bin/ty check

      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q scripts

      - name: Run Python tests
        run: .venv/bin/python -W error::ResourceWarning -m unittest discover -s scripts/tests -v

      - name: Check Hanabi Live CLIs
        run: |
          .venv/bin/python scripts/hanabi_live_bot.py --help >/dev/null
          .venv/bin/python scripts/hanabi_live_verify.py --help >/dev/null

  quality:
    name: Fast build, lint, and checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with lint tools
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install formatting dependencies
        run: npm ci --ignore-scripts

      - name: Install Python development dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --requirement scripts/requirements-dev.txt

      - name: Install Hawk toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install cargo-hawk 0.1.10
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/astral-sh/hawk/releases/download/0.1.10/cargo-hawk-installer.sh \
            | sh

      - name: Build, lint, and fast checks
        run: scripts/check.sh --fast

  exhaustive-h-group-profiles:
    name: Exhaustive H-Group profile matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test every cumulative H-Group profile
        run: scripts/check-exhaustive.sh
