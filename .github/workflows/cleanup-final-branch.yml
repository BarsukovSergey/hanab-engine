name: One-time final branch cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  delete-final-stale-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete repository setup branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          status="$(
            curl --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              --request DELETE \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GH_REPOSITORY/git/refs/heads/chore%2Frepository-hygiene-config"
          )"
          case "$status" in
            204|404) ;;
            *)
              cat "$response_file" >&2
              exit 1
              ;;
          esac
